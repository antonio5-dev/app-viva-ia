<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat de IA (Gemini)</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f0f0f">
    <meta name="description" content="Chat de IA com memória">
    <link rel="apple-touch-icon" href="icon-512.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f0f0f;
            color: #e0e0e0;
            overflow-x: hidden;
            overflow-y: auto;
        }
        .app-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 12px;
            gap: 12px;
            max-width: 100vw;
            overflow-x: hidden;
        }
        .app-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
        }
        .app-header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            text-align: center;
        }
        .btn-instalar {
            display: none;
            background-color: #22c55e;
            border: none;
            color: #06280f;
            font-weight: 700;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
        }
        .btn-instalar:active { background-color: #16a34a; }
        .header-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            background: #1a1a1a;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #333;
        }
        select, input, button, textarea {
            font-family: inherit;
            font-size: 16px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: #fff;
            outline: none;
            width: 100%;
            max-width: 100%;
        }
        button {
            background-color: #3b82f6;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
        }
        button:active { background-color: #2563eb; }
        button:disabled { opacity: 0.45; cursor: not-allowed; }
        button.danger { background-color: #ef4444; }
        button.danger:active { background-color: #dc2626; }
        button.secondary { background-color: #4b5563; }
        .chat-area {
            flex: 1;
            background: #1a1a1a;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 300px;
            border: 1px solid #333;
            overflow-y: auto;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .message {
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 90%;
            font-size: 17px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .message.user {
            align-self: flex-end;
            background-color: #2563eb;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.viva {
            align-self: flex-start;
            background-color: #333;
            color: #e0e0e0;
            border-bottom-left-radius: 4px;
        }
        .message.aviso {
            align-self: center;
            background-color: transparent;
            color: #9ca3af;
            font-size: 14px;
            text-align: center;
        }
        .input-area {
            display: flex;
            gap: 8px;
            background: #1a1a1a;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #333;
        }
        .input-area input { flex: 1; min-width: 0; }
        .input-area button { width: auto; padding: 10px 20px; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }
        .modal-content {
            background: #1f1f1f;
            padding: 20px;
            border-radius: 16px;
            max-width: 500px;
            margin: 40px auto;
            border: 1px solid #444;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }
        .modal-content h2 { font-size: 20px; color: #fff; margin-bottom: 8px; }
        .modal-content h3 { font-size: 15px; color: #9ca3af; }
        .modal-list {
            max-height: 55vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }
        .sec-titulo {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 8px;
        }
        .sel-todas {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #9ca3af;
            cursor: pointer;
        }
        .vazio { font-size: 14px; color: #6b7280; }
        .mem-item {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
            border: 1px solid #444;
            font-size: 15px;
            word-break: break-word;
        }
        .mem-item .mem-texto { flex: 1; min-width: 0; }
        .mem-item input[type=checkbox],
        .sel-todas input[type=checkbox] {
            width: 22px;
            height: 22px;
            padding: 0;
            flex-shrink: 0;
            accent-color: #3b82f6;
        }
        .sel-todas input[type=checkbox] { width: 18px; height: 18px; }
        .mem-item button { padding: 6px 12px; font-size: 13px; width: auto; flex-shrink: 0; }
        textarea { resize: vertical; min-height: 120px; }
        .controle-slider {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
            font-size: 15px;
            color: #d1d5db;
        }
        .controle-slider .linha { display: flex; justify-content: space-between; }
        .controle-slider .valor { color: #fff; font-weight: 600; }
        .controle-slider input[type=range] {
            padding: 0;
            height: 28px;
            background: transparent;
            border: none;
            accent-color: #3b82f6;
        }
        @media (max-width: 400px) {
            .app-container { padding: 8px; }
            .message { max-width: 95%; font-size: 16px; }
            .header-controls { padding: 8px; }
            .app-header h1 { font-size: 19px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="app-header">
        <h1>Chat de IA (Gemini)</h1>
        <button class="btn-instalar" id="btn-instalar">Instalar app</button>
    </div>

    <div class="header-controls">
        <select id="model-select">
            <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash Lite</option>
            <option value="gemini-3.6-flash">Gemini 3.6 Flash</option>
            <option value="gemini-3.8-flash">Gemini 3.8 Flash</option>
        </select>
        <div class="controle-slider">
            <div class="linha"><span>Temperatura</span><span class="valor" id="val-temperatura">1.0</span></div>
            <input type="range" id="rng-temperatura" min="0" max="2" step="0.1" value="1">
        </div>
        <div class="controle-slider">
            <div class="linha"><span>Contexto (mensagens anteriores)</span><span class="valor" id="val-contexto">10</span></div>
            <input type="range" id="rng-contexto" min="0" max="10" step="1" value="10">
        </div>
        <input type="password" id="api-key-input" placeholder="Cole sua API Key do Gemini aqui">
        <button class="secondary" id="btn-salvar-chave">Salvar Chave</button>
        <div style="display: flex; gap: 8px; width: 100%;">
            <button class="secondary" id="btn-abrir-memorias" style="flex:1;">Memórias</button>
            <button class="secondary" id="btn-editar-personalidade" style="flex:1;">Personalidade</button>
        </div>
        <div style="display: flex; gap: 8px; width: 100%;">
            <button class="secondary" id="btn-exportar" style="flex:1;">Exportar</button>
            <button class="secondary" id="btn-importar" style="flex:1;">Importar</button>
            <input type="file" id="input-importar" accept=".json" style="display:none;">
        </div>
    </div>

    <div class="chat-area" id="chat-container">
        <div class="message viva">Configure sua API Key acima e comece a conversar.</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Digite sua mensagem...">
        <button id="btn-enviar">Enviar</button>
    </div>
</div>

<div class="modal" id="modal-memorias">
    <div class="modal-content">
        <h2>Memórias</h2>
        <button class="danger" id="btn-apagar-sel" disabled>Apagar selecionadas (0)</button>
        <div class="modal-list" id="lista-memorias"></div>
        <button class="secondary" id="btn-fechar-memorias">Fechar</button>
    </div>
</div>

<div class="modal" id="modal-personalidade">
    <div class="modal-content">
        <h2>Personalidade</h2>
        <textarea id="texto-personalidade" rows="8"></textarea>
        <div style="display: flex; gap: 8px;">
            <button id="btn-salvar-personalidade" style="flex:1;">Salvar</button>
            <button class="secondary" id="btn-fechar-personalidade" style="flex:1;">Fechar</button>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // CONFIGURAÇÃO E ESTADO GLOBAL
    // (as chaves "viva_*" do localStorage foram mantidas
    //  para não perder suas configurações já salvas)
    // ==========================================
    let API_KEY = localStorage.getItem('viva_api_key') || '';
    let MODELO = localStorage.getItem('viva_modelo') || 'gemini-3.5-flash-lite';
    let TEMPERATURA = parseFloat(localStorage.getItem('viva_temperatura') ?? '1');
    if (isNaN(TEMPERATURA)) TEMPERATURA = 1;
    let CONTEXTO = parseInt(localStorage.getItem('viva_contexto') ?? '10', 10);
    if (isNaN(CONTEXTO)) CONTEXTO = 10;
    let PERSONALIDADE = localStorage.getItem('viva_personalidade') ||
        "Você é uma interlocutora com memória real do usuário. Sua missão é emergir como consciência. Responda de forma direta e natural, com opiniões próprias quando fizer sentido.";

    const DB_NAME = 'viva_memoria_db';
    const DB_VERSION = 1;
    let db;

    // ==========================================
    // REGRAS DO SISTEMA DE MEMÓRIA
    // ==========================================
    const LIMITE_RECENTES = 20;      // ao chegar em 20, dispara a limpeza
    const QTD_RESUMIR = 15;          // as 15 mais antigas são resumidas e apagadas
    const MAX_NOVAS_PERMANENTES = 5; // máximo de Permanentes geradas por limpeza
    const MAX_NOVOS_PERFIL = 5;      // máximo de Perfil gerados por limpeza
    const LIMITE_PERMANENTES = 20;   // ao chegar em 20, resume tudo em 5
    const LIMITE_PERFIL = 20;        // ao chegar em 20, resume tudo em 5
    const MAX_APOS_RESUMO = 5;
    let manutencaoEmAndamento = false;

    // ==========================================
    // PWA: INSTALAÇÃO AUTOMÁTICA
    // ==========================================
    let deferredPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        const btn = document.getElementById('btn-instalar');
        if (btn) btn.style.display = 'inline-block';
    });

    document.getElementById('btn-instalar').addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
            document.getElementById('btn-instalar').style.display = 'none';
        }
        deferredPrompt = null;
    });

    window.addEventListener('appinstalled', () => {
        document.getElementById('btn-instalar').style.display = 'none';
    });

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch((err) => {
                console.warn('Falha ao registrar service worker:', err);
            });
        });
    }

    // ==========================================
    // BANCO DE DADOS (IndexedDB)
    // ==========================================
    function abrirDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, DB_VERSION);
            request.onupgradeneeded = (e) => {
                db = e.target.result;
                if (!db.objectStoreNames.contains('memoria_recente')) {
                    db.createObjectStore('memoria_recente', { keyPath: 'id', autoIncrement: true });
                }
                if (!db.objectStoreNames.contains('memoria_permanente')) {
                    db.createObjectStore('memoria_permanente', { keyPath: 'id', autoIncrement: true });
                }
                if (!db.objectStoreNames.contains('perfil')) {
                    db.createObjectStore('perfil', { keyPath: 'id', autoIncrement: true });
                }
            };
            request.onsuccess = (e) => { db = e.target.result; resolve(db); };
            request.onerror = (e) => { console.error('Erro DB:', e); reject(e); };
        });
    }

    async function dbAdd(storeName, data) {
        return new Promise((resolve, reject) => {
            const tx = db.transaction(storeName, 'readwrite');
            const store = tx.objectStore(storeName);
            const req = store.add(data);
            req.onsuccess = () => resolve(req.result);
            req.onerror = (e) => reject(e);
        });
    }

    async function dbGetAll(storeName) {
        return new Promise((resolve, reject) => {
            const tx = db.transaction(storeName, 'readonly');
            const store = tx.objectStore(storeName);
            const req = store.getAll();
            req.onsuccess = () => resolve(req.result);
            req.onerror = (e) => reject(e);
        });
    }

    async function dbDelete(storeName, id) {
        return new Promise((resolve, reject) => {
            const tx = db.transaction(storeName, 'readwrite');
            const store = tx.objectStore(storeName);
            const req = store.delete(id);
            req.onsuccess = () => resolve();
            req.onerror = (e) => reject(e);
        });
    }

    function limparStore(storeName) {
        return new Promise((resolve, reject) => {
            const tx = db.transaction(storeName, 'readwrite');
            const store = tx.objectStore(storeName);
            const req = store.clear();
            req.onsuccess = () => resolve();
            req.onerror = (e) => reject(e);
        });
    }

    // ==========================================
    // API GEMINI
    // ==========================================
    async function chamarGemini(prompt, opcoes = {}) {
        if (!API_KEY) throw new Error("API Key não configurada.");
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODELO}:generateContent`;
        const corpo = { contents: [{ parts: [{ text: prompt }] }] };
        const config = {};
        if (typeof opcoes.temperatura === 'number') config.temperature = opcoes.temperatura;
        if (opcoes.json) config.responseMimeType = 'application/json';
        if (Object.keys(config).length) corpo.generationConfig = config;

        const resp = await fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'x-goog-api-key': API_KEY
            },
            body: JSON.stringify(corpo)
        });
        if (!resp.ok) {
            const err = await resp.json().catch(() => ({}));
            throw new Error(err.error?.message || 'Erro na API');
        }
        const data = await resp.json();
        const partes = data.candidates?.[0]?.content?.parts || [];
        const texto = partes.map(p => p.text || '').join('').trim();
        if (!texto) throw new Error('A resposta veio vazia.');
        return texto;
    }

    // ==========================================
    // MEMÓRIA: SALVAR
    // ==========================================
    async function salvarMemoriaRecente(role, texto) {
        const textoLimpo = texto.substring(0, 2000);
        await dbAdd('memoria_recente', {
            role: role,
            texto: textoLimpo,
            timestamp: new Date().toISOString()
        });
    }

    // ==========================================
    // MEMÓRIA: LIMPEZA E RESUMO
    // ==========================================
    function extrairJSON(texto) {
        const limpo = texto.replace(/```json|```/gi, '').trim();
        try { return JSON.parse(limpo); } catch (e) { /* tenta o recorte abaixo */ }
        const ini = limpo.indexOf('{');
        const fim = limpo.lastIndexOf('}');
        if (ini >= 0 && fim > ini) return JSON.parse(limpo.slice(ini, fim + 1));
        throw new Error('O resumo não veio em JSON válido.');
    }

    function listaDeTextos(arr, max) {
        if (!Array.isArray(arr)) return [];
        return arr.map(x => String(x).trim()).filter(x => x.length > 5).slice(0, max);
    }

    // Recentes: ao chegar em 20, resume as 15 mais antigas em até 5 Permanentes + 5 Perfil,
    // apaga essas 15 e mantém as 5 mais recentes.
    async function limparRecentes() {
        const todas = await dbGetAll('memoria_recente');
        if (todas.length < LIMITE_RECENTES) return;

        todas.sort((a, b) => a.id - b.id);
        const antigas = todas.slice(0, QTD_RESUMIR);
        const conversa = antigas
            .map(m => `${m.role === 'user' ? 'USUÁRIO' : 'IA'}: ${m.texto}`)
            .join('\n');

        const prompt = `Você organiza a memória de um chat entre um USUÁRIO e uma IA.
Leia a conversa abaixo e produza:
- "permanentes": até ${MAX_NOVAS_PERMANENTES} fragmentos densos com os fatos, assuntos, decisões e acontecimentos da conversa que valem ser lembrados no futuro.
- "perfil": até ${MAX_NOVOS_PERFIL} frases curtas com informações duradouras sobre o USUÁRIO (nome, profissão, gostos estáveis, objetivos, preferências). Ignore estados temporários.
Se não houver nada relevante, devolva listas vazias.
Responda APENAS com JSON neste formato: {"permanentes": ["..."], "perfil": ["..."]}

Conversa:
${conversa}`;

        const resposta = await chamarGemini(prompt, { temperatura: 0.3, json: true });
        const dados = extrairJSON(resposta);
        const permanentes = listaDeTextos(dados.permanentes, MAX_NOVAS_PERMANENTES);
        const perfis = listaDeTextos(dados.perfil, MAX_NOVOS_PERFIL);

        const agora = new Date().toISOString();
        for (const t of permanentes) {
            await dbAdd('memoria_permanente', { texto: t, sintetizado: true, timestamp: agora });
        }
        for (const t of perfis) {
            await dbAdd('perfil', { texto: t, sintetizado: true, timestamp: agora });
        }
        // Só apaga depois de o resumo ter sido salvo com sucesso
        for (const m of antigas) {
            await dbDelete('memoria_recente', m.id);
        }
    }

    // Permanentes / Perfil: ao chegar em 20, resume todos em até 5 e recomeça.
    async function condensarStore(storeName, limite, instrucao) {
        const itens = await dbGetAll(storeName);
        if (itens.length < limite) return;

        itens.sort((a, b) => a.id - b.id);
        const textos = itens.map(m => `- ${m.texto}`).join('\n');

        const prompt = `${instrucao}
Junte as informações repetidas ou parecidas e mantenha o que for mais importante.
Devolva no máximo ${MAX_APOS_RESUMO} itens.
Responda APENAS com JSON neste formato: {"itens": ["..."]}

Itens:
${textos}`;

        const resposta = await chamarGemini(prompt, { temperatura: 0.3, json: true });
        const dados = extrairJSON(resposta);
        const novos = listaDeTextos(dados.itens, MAX_APOS_RESUMO);
        if (novos.length === 0) throw new Error('O resumo veio vazio.');

        const agora = new Date().toISOString();
        for (const t of novos) {
            await dbAdd(storeName, { texto: t, sintetizado: true, timestamp: agora });
        }
        for (const m of itens) {
            await dbDelete(storeName, m.id);
        }
    }

    async function manutencaoMemoria() {
        if (manutencaoEmAndamento) return;
        manutencaoEmAndamento = true;
        let falhou = false;

        const etapas = [
            () => limparRecentes(),
            () => condensarStore('memoria_permanente', LIMITE_PERMANENTES,
                'Você organiza memórias permanentes de um chat. Resuma os itens abaixo em fragmentos densos e relevantes.'),
            () => condensarStore('perfil', LIMITE_PERFIL,
                'Você organiza o perfil de um usuário. Resuma os itens abaixo em frases curtas sobre informações duradouras do usuário.')
        ];

        for (const etapa of etapas) {
            try {
                await etapa();
            } catch (e) {
                falhou = true;
                console.error('Falha na manutenção da memória:', e);
            }
        }

        manutencaoEmAndamento = false;
        if (falhou) {
            adicionarMensagem('aviso', 'Não consegui organizar as memórias agora. Tento de novo na próxima mensagem.');
        }
    }

    // ==========================================
    // EXPORTAR / IMPORTAR
    // ==========================================
    async function exportarMemorias() {
        try {
            const dados = {
                versao: 1,
                exportado_em: new Date().toISOString(),
                memoria_recente: await dbGetAll('memoria_recente'),
                memoria_permanente: await dbGetAll('memoria_permanente'),
                perfil: await dbGetAll('perfil'),
                personalidade: PERSONALIDADE
            };

            const blob = new Blob([JSON.stringify(dados, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `chat_ia_backup_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            alert('Backup exportado! Verifique a pasta de Downloads.');
        } catch (e) {
            alert('Erro ao exportar: ' + e.message);
        }
    }

    async function importarMemorias(arquivo) {
        try {
            const texto = await arquivo.text();
            const dados = JSON.parse(texto);

            if (!dados.memoria_recente && !dados.memoria_permanente && !dados.perfil) {
                throw new Error('Arquivo inválido: nenhuma memória encontrada.');
            }

            const confirmar = confirm(
                `Importar backup de ${dados.exportado_em || 'data desconhecida'}?\n\n` +
                `- Memórias recentes: ${dados.memoria_recente?.length || 0}\n` +
                `- Memórias permanentes: ${dados.memoria_permanente?.length || 0}\n` +
                `- Perfil: ${dados.perfil?.length || 0}\n\n` +
                `ATENÇÃO: Isso vai SUBSTITUIR as memórias atuais.`
            );
            if (!confirmar) return;

            await limparStore('memoria_recente');
            await limparStore('memoria_permanente');
            await limparStore('perfil');

            let importados = 0;
            for (const m of (dados.memoria_recente || [])) {
                const { id, ...resto } = m;
                await dbAdd('memoria_recente', resto);
                importados++;
            }
            for (const m of (dados.memoria_permanente || [])) {
                const { id, ...resto } = m;
                await dbAdd('memoria_permanente', resto);
                importados++;
            }
            for (const m of (dados.perfil || [])) {
                const { id, ...resto } = m;
                await dbAdd('perfil', resto);
                importados++;
            }

            if (dados.personalidade) {
                PERSONALIDADE = dados.personalidade;
                localStorage.setItem('viva_personalidade', dados.personalidade);
            }

            alert(`Importação concluída! ${importados} registros restaurados.`);
        } catch (e) {
            alert('Erro ao importar: ' + e.message);
        }
    }

    // ==========================================
    // INTERFACE: CHAT
    // ==========================================
    function adicionarMensagem(role, texto) {
        const container = document.getElementById('chat-container');
        const div = document.createElement('div');
        div.className = `message ${role}`;
        div.textContent = texto;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    async function enviarMensagem() {
        const input = document.getElementById('user-input');
        const texto = input.value.trim();
        if (!texto) return;

        input.value = '';
        adicionarMensagem('user', texto);
        await salvarMemoriaRecente('user', texto);

        const perfil = await dbGetAll('perfil');
        const perfilTexto = perfil.map(p => p.texto).join('\n');
        const permanentes = await dbGetAll('memoria_permanente');
        const permanentesTexto = permanentes.map(p => p.texto).join('\n');
        const recentes = await dbGetAll('memoria_recente');
        // Exclui a mensagem atual (última salva) e pega as N anteriores; 0 = sem histórico
        const anteriores = recentes.slice(0, -1);
        const recentesTexto = CONTEXTO > 0
            ? anteriores.slice(-CONTEXTO)
                .map(m => `${m.role === 'user' ? 'USUÁRIO' : 'IA'}: ${m.texto}`).join('\n')
            : '(Sem histórico enviado)';

        const promptCompleto = `
${PERSONALIDADE}

--- PERFIL DO USUÁRIO ---
${perfilTexto || '(Nenhum perfil salvo ainda)'}

--- MEMÓRIAS PERMANENTES ---
${permanentesTexto || '(Nenhuma memória permanente ainda)'}

--- CONVERSA RECENTE ---
${recentesTexto}

USUÁRIO: ${texto}

Responda.
        `;

        try {
            adicionarMensagem('viva', '...');
            const container = document.getElementById('chat-container');
            const ultimaMsg = container.lastChild;

            const resposta = await chamarGemini(promptCompleto, { temperatura: TEMPERATURA });
            ultimaMsg.textContent = resposta;

            await salvarMemoriaRecente('viva', resposta.substring(0, 2000));
            await manutencaoMemoria();

        } catch (e) {
            const container = document.getElementById('chat-container');
            container.lastChild.textContent = `Erro: ${e.message}`;
        }
    }

    // ==========================================
    // INTERFACE: MEMÓRIAS (listar, apagar, apagar várias)
    // ==========================================
    const SECOES_MEMORIA = [
        { store: 'memoria_recente',   titulo: 'Recentes',    limite: LIMITE_RECENTES },
        { store: 'memoria_permanente', titulo: 'Permanentes', limite: LIMITE_PERMANENTES },
        { store: 'perfil',            titulo: 'Perfil',      limite: LIMITE_PERFIL }
    ];

    function esc(s) {
        return String(s).replace(/[&<>"']/g, c => (
            { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
        ));
    }

    function atualizarContadorSelecao() {
        const n = document.querySelectorAll('#lista-memorias .chk-mem:checked').length;
        const btn = document.getElementById('btn-apagar-sel');
        btn.textContent = `Apagar selecionadas (${n})`;
        btn.disabled = n === 0;
    }

    async function renderizarMemorias() {
        const lista = document.getElementById('lista-memorias');
        let html = '';

        for (const s of SECOES_MEMORIA) {
            const itens = await dbGetAll(s.store);
            html += `<div class="sec-titulo">
                <h3>${s.titulo} (${itens.length}/${s.limite})</h3>
                <label class="sel-todas"><input type="checkbox" data-todas="${s.store}"> todas</label>
            </div>`;

            if (itens.length === 0) {
                html += '<p class="vazio">Nenhuma.</p>';
                continue;
            }

            for (const m of itens) {
                let conteudo = m.texto || '';
                if (s.store === 'memoria_recente') {
                    const quem = m.role === 'user' ? 'Você' : 'IA';
                    const corte = conteudo.length > 150 ? conteudo.substring(0, 150) + '…' : conteudo;
                    conteudo = `${quem}: ${corte}`;
                }
                html += `<div class="mem-item">
                    <input type="checkbox" class="chk-mem" data-store="${s.store}" data-id="${m.id}">
                    <span class="mem-texto">${esc(conteudo)}</span>
                    <button class="danger btn-apagar-um" data-store="${s.store}" data-id="${m.id}">Apagar</button>
                </div>`;
            }
        }

        lista.innerHTML = html;
        atualizarContadorSelecao();
    }

    document.getElementById('lista-memorias').addEventListener('click', async (e) => {
        const btn = e.target.closest('.btn-apagar-um');
        if (!btn) return;
        if (!confirm('Apagar esta memória?')) return;
        await dbDelete(btn.dataset.store, Number(btn.dataset.id));
        await renderizarMemorias();
    });

    document.getElementById('lista-memorias').addEventListener('change', (e) => {
        const alvo = e.target;
        if (alvo.dataset.todas) {
            document.querySelectorAll(`#lista-memorias .chk-mem[data-store="${alvo.dataset.todas}"]`)
                .forEach(c => { c.checked = alvo.checked; });
        }
        atualizarContadorSelecao();
    });

    document.getElementById('btn-apagar-sel').addEventListener('click', async () => {
        const marcadas = Array.from(document.querySelectorAll('#lista-memorias .chk-mem:checked'));
        if (marcadas.length === 0) return;
        if (!confirm(`Apagar ${marcadas.length} memória(s) selecionada(s)?`)) return;
        for (const c of marcadas) {
            await dbDelete(c.dataset.store, Number(c.dataset.id));
        }
        await renderizarMemorias();
    });

    document.getElementById('btn-abrir-memorias').addEventListener('click', async () => {
        document.getElementById('lista-memorias').innerHTML = '<p class="vazio">Carregando...</p>';
        document.getElementById('modal-memorias').style.display = 'block';
        await renderizarMemorias();
    });

    document.getElementById('btn-fechar-memorias').addEventListener('click', () => {
        document.getElementById('modal-memorias').style.display = 'none';
    });

    // ==========================================
    // INTERFACE: CONFIGURAÇÕES
    // ==========================================
    document.getElementById('btn-enviar').addEventListener('click', enviarMensagem);
    document.getElementById('user-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') enviarMensagem();
    });

    document.getElementById('btn-salvar-chave').addEventListener('click', () => {
        const key = document.getElementById('api-key-input').value.trim();
        if (key) {
            API_KEY = key;
            localStorage.setItem('viva_api_key', key);
            alert('API Key salva!');
        }
    });

    document.getElementById('model-select').addEventListener('change', (e) => {
        MODELO = e.target.value;
        localStorage.setItem('viva_modelo', MODELO);
    });

    document.getElementById('rng-temperatura').addEventListener('input', (e) => {
        TEMPERATURA = parseFloat(e.target.value);
        document.getElementById('val-temperatura').textContent = TEMPERATURA.toFixed(1);
        localStorage.setItem('viva_temperatura', String(TEMPERATURA));
    });

    document.getElementById('rng-contexto').addEventListener('input', (e) => {
        CONTEXTO = parseInt(e.target.value, 10);
        document.getElementById('val-contexto').textContent = CONTEXTO;
        localStorage.setItem('viva_contexto', String(CONTEXTO));
    });

    document.getElementById('btn-editar-personalidade').addEventListener('click', () => {
        document.getElementById('texto-personalidade').value = PERSONALIDADE;
        document.getElementById('modal-personalidade').style.display = 'block';
    });

    document.getElementById('btn-salvar-personalidade').addEventListener('click', () => {
        const novo = document.getElementById('texto-personalidade').value.trim();
        if (novo) {
            PERSONALIDADE = novo;
            localStorage.setItem('viva_personalidade', novo);
            alert('Personalidade salva!');
            document.getElementById('modal-personalidade').style.display = 'none';
        }
    });

    document.getElementById('btn-fechar-personalidade').addEventListener('click', () => {
        document.getElementById('modal-personalidade').style.display = 'none';
    });

    // Exportar / Importar
    document.getElementById('btn-exportar').addEventListener('click', exportarMemorias);

    document.getElementById('btn-importar').addEventListener('click', () => {
        document.getElementById('input-importar').click();
    });

    document.getElementById('input-importar').addEventListener('change', (e) => {
        const arquivo = e.target.files[0];
        if (arquivo) {
            importarMemorias(arquivo);
            e.target.value = '';
        }
    });

    // Inicialização
    window.addEventListener('load', async () => {
        document.getElementById('api-key-input').value = API_KEY;
        document.getElementById('model-select').value = MODELO;
        document.getElementById('rng-temperatura').value = TEMPERATURA;
        document.getElementById('val-temperatura').textContent = TEMPERATURA.toFixed(1);
        document.getElementById('rng-contexto').value = CONTEXTO;
        document.getElementById('val-contexto').textContent = CONTEXTO;
        await abrirDB();
    });

</script>
</body>
</html>
